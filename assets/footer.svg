<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120409" />
      <stop offset="50%" stop-color="#240715" />
      <stop offset="100%" stop-color="#0E0307" />
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E1224" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#A3284C" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4E1224" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E25178" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <style>
      .glow-pulse {
        animation: footerPulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes footerPulse {
        0% { opacity: 0.45; }
        100% { opacity: 0.9; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="110" rx="14" fill="url(#footerBg)" />
  <rect x="1.5" y="1.5" width="957" height="107" rx="13" fill="none" stroke="url(#footerBorder)" stroke-width="1.5" />

  <!-- Top Decorative Accent -->
  <line x1="280" y1="20" x2="680" y2="20" stroke="#481223" stroke-width="1" />
  <line x1="400" y1="20" x2="560" y2="20" stroke="url(#rubyGlow)" stroke-width="1.75" />
  <circle class="glow-pulse" cx="480" cy="20" r="3.5" fill="#FF7597" />

  <!-- Footer Text Content -->
  <g transform="translate(480, 56)" text-anchor="middle">
    <text y="0" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">
      CRAFTING IMPACTFUL DIGITAL EXPERIENCES WITH MODERN ARCHITECTURE
    </text>
    <text y="24" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="500">
      Built with craft &amp; conviction by <tspan fill="#FF8CA8" font-weight="700">Amrit Prakash</tspan> (@iamamritjha) • Open to opportunities &amp; impactful collaborations
    </text>
  </g>
</svg>
