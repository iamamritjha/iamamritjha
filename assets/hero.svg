<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120409" />
      <stop offset="50%" stop-color="#1E0611" />
      <stop offset="100%" stop-color="#0B0205" />
    </linearGradient>

    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B142E" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#C22953" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#E5B25D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6B142E" stop-opacity="0.5" />
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="glowLeft" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8F1538" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#3D0817" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120409" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C22953" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#24050F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#120409" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F4" />
      <stop offset="100%" stop-color="#FFA8BF" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3CA65" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240613" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#16030B" stop-opacity="0.95" />
    </linearGradient>

    <pattern id="subtleGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#66142B" stroke-width="0.6" stroke-opacity="0.1" />
      <circle cx="0" cy="0" r="0.75" fill="#E27396" fill-opacity="0.15" />
    </pattern>

    <style>
      .ambient-left {
        animation: pulseLeft 8s ease-in-out infinite alternate;
      }
      .ambient-right {
        animation: pulseRight 10s ease-in-out infinite alternate;
      }
      .beacon-dot {
        animation: beaconGlow 2.5s ease-in-out infinite alternate;
      }
      @keyframes pulseLeft {
        0% { opacity: 0.4; }
        100% { opacity: 0.75; }
      }
      @keyframes pulseRight {
        0% { opacity: 0.3; }
        100% { opacity: 0.65; }
      }
      @keyframes beaconGlow {
        0% { fill-opacity: 0.55; stroke-opacity: 0.35; }
        100% { fill-opacity: 1; stroke-opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="270" rx="14" fill="url(#heroBg)" />

  <!-- Ambient Light Fields -->
  <circle class="ambient-left" cx="240" cy="90" r="220" fill="url(#glowLeft)" />
  <circle class="ambient-right" cx="780" cy="150" r="220" fill="url(#glowRight)" />

  <!-- Subtle Geometric Grid -->
  <rect width="960" height="270" rx="14" fill="url(#subtleGrid)" />

  <!-- Outer Elegant Border -->
  <rect x="1" y="1" width="958" height="268" rx="13" fill="none" stroke="url(#heroBorder)" stroke-width="1.25" />

  <!-- Top Right Status Capsule -->
  <g transform="translate(664, 24)">
    <rect width="246" height="28" rx="14" fill="#200511" stroke="#5A1226" stroke-width="1" />
    <circle class="beacon-dot" cx="16" cy="14" r="4" fill="#10B981" stroke="#34D399" stroke-width="2" />
    <text x="28" y="18" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">
      OPEN TO COLLABORATION &amp; ROLES
    </text>
  </g>

  <!-- Left Monogram Crest -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#220613" stroke="#871A3B" stroke-width="1.25" />
    <rect x="5" y="5" width="60" height="60" rx="12" fill="#14030B" stroke="#480F21" stroke-width="0.8" />
    <text x="35" y="42" text-anchor="middle" fill="url(#nameGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" letter-spacing="1">
      AP
    </text>
    <text x="35" y="55" text-anchor="middle" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="700" letter-spacing="2">
      ENGINEER
    </text>
  </g>

  <!-- Main Identity Header -->
  <g transform="translate(140, 52)">
    <!-- Kicker Tagline -->
    <text x="0" y="0" fill="url(#goldGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">
      SOFTWARE ENGINEER &amp; FULL-STACK DEVELOPER
    </text>

    <!-- Primary Name -->
    <text x="0" y="36" fill="url(#nameGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1.2">
      AMRIT PRAKASH
    </text>

    <!-- Handle & Focus Areas -->
    <text x="0" y="62" fill="#E2BAC8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
      <tspan fill="#FF8CA8" font-weight="700">@iamamritjha</tspan>
      <tspan fill="#66162B"> • </tspan>
      <tspan fill="#F5DFE7">Architecting High-Utility Platforms</tspan>
      <tspan fill="#66162B"> • </tspan>
      <tspan fill="#D4AF37">Web Security &amp; Open Source</tspan>
    </text>
  </g>

  <!-- Refined Accent Rule -->
  <line x1="48" y1="168" x2="912" y2="168" stroke="#360817" stroke-width="1" />
  <line x1="280" y1="168" x2="520" y2="168" stroke="url(#heroBorder)" stroke-width="1.5" />
  <circle cx="400" cy="168" r="2.5" fill="#D4AF37" />

  <!-- Four Streamlined Highlight Capsules (Balanced, Elegant Spacing) -->
  <!-- Capsule 1: Full-Stack Systems -->
  <g transform="translate(48, 194)">
    <rect width="202" height="38" rx="19" fill="url(#pillGrad)" stroke="#5A1226" stroke-width="1" />
    <circle cx="20" cy="19" r="9" fill="#3D0B1E" />
    <text x="20" y="23" text-anchor="middle" font-size="10">⚡</text>
    <text x="38" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">Full-Stack Systems</text>
    <text x="38" y="29" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5">Next.js, Node &amp; Express</text>
  </g>

  <!-- Capsule 2: LifeLedger AI Health -->
  <g transform="translate(268, 194)">
    <rect width="216" height="38" rx="19" fill="url(#pillGrad)" stroke="#871A3B" stroke-width="1.2" />
    <circle cx="20" cy="19" r="9" fill="#4B0F24" />
    <text x="20" y="23" text-anchor="middle" font-size="10">🧠</text>
    <text x="38" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">AI Health: LifeLedger</text>
    <text x="38" y="29" fill="#FF9EBA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5">Health Intelligence Vault</text>
  </g>

  <!-- Capsule 3: Security & Defense -->
  <g transform="translate(502, 194)">
    <rect width="198" height="38" rx="19" fill="url(#pillGrad)" stroke="#5A1226" stroke-width="1" />
    <circle cx="20" cy="19" r="9" fill="#3D0B1E" />
    <text x="20" y="23" text-anchor="middle" font-size="10">🛡️</text>
    <text x="38" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">Security &amp; Defense</text>
    <text x="38" y="29" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5">Application Hardening</text>
  </g>

  <!-- Capsule 4: Algorithmic Logic -->
  <g transform="translate(718, 194)">
    <rect width="194" height="38" rx="19" fill="url(#pillGrad)" stroke="#5A1226" stroke-width="1" />
    <circle cx="20" cy="19" r="9" fill="#3D0B1E" />
    <text x="20" y="23" text-anchor="middle" font-size="10">🧩</text>
    <text x="38" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700">Algorithmic Logic</text>
    <text x="38" y="29" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5">Data Structures &amp; Problem Solving</text>
  </g>
</svg>
