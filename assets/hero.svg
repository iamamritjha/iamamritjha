<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120409" />
      <stop offset="50%" stop-color="#220713" />
      <stop offset="100%" stop-color="#0E0307" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3284C" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4E1224" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E27396" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="orbBurgundy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9E1B42" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#540C20" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#120409" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbRose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E25178" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#67102A" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120409" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#120409" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#FCE7ED" />
      <stop offset="85%" stop-color="#FF9EBA" />
      <stop offset="100%" stop-color="#E27396" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E25178" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380C1C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1F060F" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7A1836" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="1" fill="#E27396" fill-opacity="0.18" />
    </pattern>

    <style>
      .ambient-glow-1 {
        animation: pulse1 7s ease-in-out infinite alternate;
      }
      .ambient-glow-2 {
        animation: pulse2 9s ease-in-out infinite alternate;
      }
      .beacon {
        animation: beaconGlow 2.5s ease-in-out infinite alternate;
      }
      .avatar-glow {
        animation: avatarPulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse1 {
        0% { opacity: 0.4; transform: translate(0px, 0px) scale(1); }
        100% { opacity: 0.75; transform: translate(-20px, 15px) scale(1.1); }
      }
      @keyframes pulse2 {
        0% { opacity: 0.35; transform: translate(0px, 0px) scale(1); }
        100% { opacity: 0.7; transform: translate(25px, -15px) scale(1.15); }
      }
      @keyframes beaconGlow {
        0% { fill-opacity: 0.5; stroke-opacity: 0.4; }
        100% { fill-opacity: 1; stroke-opacity: 0.95; }
      }
      @keyframes avatarPulse {
        0% { stroke: #A3284C; stroke-opacity: 0.6; }
        100% { stroke: #FF7597; stroke-opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle class="ambient-glow-1" cx="200" cy="90" r="190" fill="url(#orbBurgundy)" />
  <circle class="ambient-glow-2" cx="800" cy="220" r="220" fill="url(#orbRose)" />
  <circle cx="860" cy="60" r="140" fill="url(#orbGold)" opacity="0.3" />

  <!-- Subtle Cyber Grid -->
  <rect width="960" height="320" rx="16" fill="url(#cyberGrid)" />

  <!-- Outer Rounded Border with Burgundy Gradient -->
  <rect x="1.5" y="1.5" width="957" height="317" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.75" />

  <!-- Top Status Badge -->
  <g transform="translate(630, 28)">
    <rect width="280" height="30" rx="15" fill="url(#badgeGrad)" stroke="#7A1836" stroke-width="1" />
    <circle class="beacon" cx="20" cy="15" r="4.5" fill="#10B981" stroke="#34D399" stroke-width="2" />
    <text x="34" y="19.5" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      OPEN TO COLLABORATION &amp; ROLES
    </text>
  </g>

  <!-- Left Tech Shield / Avatar Monogram -->
  <g transform="translate(52, 50)">
    <!-- Decorative Outer Ring -->
    <rect class="avatar-glow" x="-4" y="-4" width="88" height="88" rx="20" fill="none" stroke="#A3284C" stroke-width="1.5" stroke-dasharray="6 3" />
    <!-- Main Emblem Box -->
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#250714" stroke="#871A3B" stroke-width="1.5" filter="url(#softGlow)" />
    <!-- Inner Accent Border -->
    <rect x="6" y="6" width="68" height="68" rx="12" fill="#16040C" stroke="#480F21" stroke-width="1" />
    <!-- Tech Initials -->
    <text x="40" y="47" text-anchor="middle" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5">
      AP
    </text>
    <text x="40" y="63" text-anchor="middle" fill="#E27396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="2">
      DEV
    </text>
  </g>

  <!-- Hero Content Section -->
  <g transform="translate(156, 68)">
    <!-- Sub-kicker -->
    <text x="0" y="0" fill="#FF7597" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">
      HELLO, WORLD! I'M
    </text>

    <!-- Main Name -->
    <text x="0" y="40" fill="url(#nameGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="1.5" filter="url(#textShadow)">
      AMRIT PRAKASH
    </text>

    <!-- Identity & Handle -->
    <text x="0" y="68" fill="#E7C5D2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500">
      <tspan fill="#FF8CA8" font-weight="700">@iamamritjha</tspan>
      <tspan fill="#8E3250"> • </tspan>
      <tspan fill="#F5DFE7">Full-Stack Developer &amp; Software Engineer</tspan>
      <tspan fill="#8E3250"> • </tspan>
      <tspan fill="#D4AF37" font-weight="600">Open Source &amp; Systems</tspan>
    </text>

    <!-- Impact Statement -->
    <text x="0" y="96" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-style="italic" opacity="0.92">
      "Building high-utility digital platforms that solve real problems for society."
    </text>
  </g>

  <!-- Divider Accent Line -->
  <line x1="52" y1="210" x2="908" y2="210" stroke="#481223" stroke-width="1" />
  <line x1="280" y1="210" x2="520" y2="210" stroke="url(#accentGrad)" stroke-width="2" />
  <circle cx="400" cy="210" r="3.5" fill="#D4AF37" />

  <!-- Bottom Highlights Pills Grid -->
  <!-- Pill 1: Full-Stack Development -->
  <g transform="translate(52, 236)">
    <rect width="202" height="46" rx="10" fill="#200612" stroke="#5E162B" stroke-width="1" />
    <circle cx="22" cy="23" r="10" fill="#3D0B1E" />
    <text x="22" y="27" text-anchor="middle" font-size="11">⚡</text>
    <text x="42" y="20" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">Full-Stack Development</text>
    <text x="42" y="34" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5">Modern Web Architectures</text>
  </g>

  <!-- Pill 2: Featured Project LifeLedger -->
  <g transform="translate(268, 236)">
    <rect width="216" height="46" rx="10" fill="#240715" stroke="#7A1836" stroke-width="1.2" />
    <circle cx="22" cy="23" r="10" fill="#4B0F24" />
    <text x="22" y="27" text-anchor="middle" font-size="11">🧠</text>
    <text x="42" y="20" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">AI Health: LifeLedger</text>
    <text x="42" y="34" fill="#FF9EBA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5">Live Health Intelligence Vault</text>
  </g>

  <!-- Pill 3: Cybersecurity Focus -->
  <g transform="translate(498, 236)">
    <rect width="194" height="46" rx="10" fill="#200612" stroke="#5E162B" stroke-width="1" />
    <circle cx="22" cy="23" r="10" fill="#3D0B1E" />
    <text x="22" y="27" text-anchor="middle" font-size="11">🛡️</text>
    <text x="42" y="20" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">Cybersecurity Focus</text>
    <text x="42" y="34" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5">Security Mindset &amp; Defense</text>
  </g>

  <!-- Pill 4: Data Structures & Algorithmic Logic -->
  <g transform="translate(706, 236)">
    <rect width="202" height="46" rx="10" fill="#200612" stroke="#5E162B" stroke-width="1" />
    <circle cx="22" cy="23" r="10" fill="#3D0B1E" />
    <text x="22" y="27" text-anchor="middle" font-size="11">🧩</text>
    <text x="42" y="20" fill="#FCE7ED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700">Data Structures &amp; Logic</text>
    <text x="42" y="34" fill="#C498A9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5">Algorithmic Problem Solving</text>
  </g>
</svg>
